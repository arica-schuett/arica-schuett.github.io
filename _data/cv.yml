cv:
  name: Arica Schuett
  label: Moreau Postdoctoral Fellow, Department of Political Science, University of Notre Dame
  email: aschuet3@nd.edu
  website: https://www.aricaschuett.com
  summary: >-
    Arica Schuett is a Moreau Postdoctoral Fellow in the Department of Political Science at the University of Notre Dame.
    Her research examines electoral behavior, social movements, and Black politics in the United States, with a focus on
    protest, shifting partisan coalitions, and electoral change. Her work appears in the *Journal of Race, Ethnicity, and
    Politics*, *Urban Studies*, and *PS: Political Science & Politics*, and is forthcoming in the *Journal of Peace Research*.

